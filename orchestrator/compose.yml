# The orchestrator with VictoriaMetrics, vmagent, VictoriaLogs, VictoriaTraces, Grafana, and
# grafana-mcp (read-only Grafana access for LLM root-cause analysis).
# Setup and rollout: README.md, "With Docker Compose".
name: ozwell-orchestrator

services:
  orchestrator:
    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    image: ozwell-computer-orchestrator:dev
    # Rebuild on every `docker compose up`, so a `git pull` always takes effect.
    pull_policy: build
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ORCHESTRATOR_HOST: 0.0.0.0
      ORCHESTRATOR_PORT: 8090
      # Internal listener for vmagent; vmagent gets the same token.
      ORCHESTRATOR_INTERNAL_HOST: 0.0.0.0
      ORCHESTRATOR_INTERNAL_PORT: 8091
      ORCHESTRATOR_INTERNAL_TOKEN: ${ORCHESTRATOR_INTERNAL_TOKEN:?set ORCHESTRATOR_INTERNAL_TOKEN in .env}
      ORCHESTRATOR_SD_ADDRESS: orchestrator:8091
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://victoriatraces:10428/insert/opentelemetry/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://victorialogs:9428/insert/opentelemetry/v1/logs
      ORCHESTRATOR_LOG_SHIP_URL: http://victorialogs:9428/insert/journald/upload
    # No ports: `proxy` publishes 8090, so `docker rollout` can run two replicas at once.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then((r) => process.exit(r.status === 204 ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 30s
    # On stop, in-flight MCP calls finish first (the instance call timeout is 11 min).
    stop_grace_period: 11m

  proxy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    # The directory, not the file: git replaces files, which a file mount wouldn't see.
    # --watch reloads on changes; a reload, unlike a restart, keeps calls in progress.
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile, --watch]
    volumes: [./deploy/caddy:/etc/caddy:ro]
    ports:
      - "${ORCHESTRATOR_BIND:-127.0.0.1}:${ORCHESTRATOR_PUBLISH_PORT:-8090}:8090"

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.156.0
    restart: unless-stopped
    command: [-storageDataPath=/storage, -retentionPeriod=30d]
    volumes: [vmdata:/storage]

  vmagent:
    image: victoriametrics/vmagent:v1.156.0
    restart: unless-stopped
    command:
      - -promscrape.config=/etc/vmagent/scrape.yml
      - -promscrape.httpSDCheckInterval=30s
      - -remoteWrite.url=http://victoriametrics:8428/api/v1/write
      - -remoteWrite.tmpDataPath=/tmp/vmagent
    environment:
      # scrape.yml reads it as %{ORCHESTRATOR_INTERNAL_TOKEN}.
      ORCHESTRATOR_INTERNAL_TOKEN: ${ORCHESTRATOR_INTERNAL_TOKEN:?set ORCHESTRATOR_INTERNAL_TOKEN in .env}
    volumes: [./deploy/vmagent/scrape.yml:/etc/vmagent/scrape.yml:ro]
    depends_on: [victoriametrics]

  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=14d
      # Instance journals: one stream per computer and unit.
      - -journald.streamFields=OZWELL_INSTANCE_ID,_SYSTEMD_UNIT
    volumes: [vldata:/storage]

  victoriatraces:
    image: victoriametrics/victoria-traces:v0.13.0
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=7d
      # Traces become searchable after both (defaults 20s + 30s); opening one by id is immediate.
      - -insert.indexFlushInterval=10s
      - -search.latencyOffset=10s
    volumes: [vtdata:/storage]

  grafana:
    image: grafana/grafana:13.2.6
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GF_SERVER_SERVE_FROM_SUB_PATH:-false}
      GF_PLUGINS_PREINSTALL: victoriametrics-logs-datasource
      # Land on the Fleet dashboard after login (the others are linked from it).
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fleet.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Alert emails (deploy/grafana/provisioning/alerting). Set these in .env.
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-admin@grafana.localhost}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-ozwell-computer alerts}
      GF_SMTP_STARTTLS_POLICY: ${GF_SMTP_STARTTLS_POLICY:-}
      # Recipients, ";"-separated; read by contact-points.yml as $ALERT_EMAIL_TO.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-root@localhost}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on: [victoriametrics, victorialogs, victoriatraces]

  # Read-only Grafana access for LLM root-cause analysis (README.md, "LLM access for
  # root-cause analysis"). grafana-mcp-token runs on every `up`: it ensures the Viewer
  # service account `mcp` and writes a fresh token for grafana-mcp, revoking older ones.
  grafana-mcp-token:
    image: node:26-trixie-slim
    restart: "no"
    command: [node, /app/bootstrap-token.ts]
    environment:
      GRAFANA_URL: http://grafana:3000
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      TOKEN_FILE: /run/grafana-mcp/token
      # mcp-grafana's image user (uid 1000, gid 999) reads the 0600 file.
      TOKEN_OWNER: "1000:999"
    volumes:
      - ./deploy/grafana-mcp:/app:ro
      - grafana-mcp-token:/run/grafana-mcp
    depends_on: [grafana]

  grafana-mcp:
    image: grafana/mcp-grafana:2.3.0
    restart: unless-stopped
    user: "1000:999"
    # A shell only to pass the RCA guide as --instructions-append; "$$@" is `command`.
    entrypoint: [/bin/sh, -c, 'exec /app/mcp-grafana "$$@" --instructions-append "$$(cat /etc/grafana-mcp/rca-guide.md)"', mcp-grafana]
    command:
      - --transport=streamable-http
      - --address=0.0.0.0:8000
      # The Host values it accepts (a DNS-rebinding guard): the published loopback address,
      # plus GRAFANA_MCP_ALLOWED_HOSTS (e.g. the external reverse proxy's hostname).
      - --allowed-hosts=localhost:${GRAFANA_MCP_PORT:-8000},127.0.0.1:${GRAFANA_MCP_PORT:-8000},[::1]:${GRAFANA_MCP_PORT:-8000},${GRAFANA_MCP_ALLOWED_HOSTS:-}
      # Read-only: no create/update tools, no raw Grafana API passthrough. Only the
      # categories RCA needs (the defaults add IRM, OnCall, rendering, ... we don't run).
      - --disable-write
      - --disable-api
      - --enabled-tools=search,datasource,prometheus,loki,tempo,dashboard,folder,navigation,alerting,annotations
      - --grafana-timeout=30s
      # Never debug: it would log tool arguments and Grafana responses.
      - --log-level=info
      - --usage-stats=disabled
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE: /run/grafana-mcp/token
      GRAFANA_ORG_ID: "1"
      # Callers send "Authorization: Bearer <this>". Not the Grafana token.
      MCP_GRAFANA_SERVER_TOKEN: ${MCP_GRAFANA_SERVER_TOKEN:?set MCP_GRAFANA_SERVER_TOKEN in .env}
    volumes:
      - grafana-mcp-token:/run/grafana-mcp:ro
      - ./deploy/grafana-mcp:/etc/grafana-mcp:ro
    # Like Grafana: its own port, routed and TLS-terminated by the external reverse proxy.
    ports:
      - "${GRAFANA_MCP_BIND:-127.0.0.1}:${GRAFANA_MCP_PORT:-8000}:8000"
    depends_on:
      grafana-mcp-token: { condition: service_completed_successfully }

volumes:
  vmdata:
  vldata:
  vtdata:
  grafana:
  grafana-mcp-token:
