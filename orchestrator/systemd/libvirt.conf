# Install as /etc/systemd/system/ozwell-computer-orchestrator.service.d/libvirt.conf
# The libvirt group is root-equivalent. See docs/libvirt-deployment.md first.
[Unit]
Requires=libvirtd.service
After=libvirtd.service

[Service]
DynamicUser=no
User=ozwell-computer-orchestrator
Group=ozwell-computer-orchestrator
SupplementaryGroups=libvirt
StateDirectory=ozwell-computer
StateDirectoryMode=0711
# The private state directory is made writable by StateDirectory, while the
# original service's ProtectSystem/NoNewPrivileges settings stay in effect.
