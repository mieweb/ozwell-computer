# Container-only additions (not part of the .deb):
[Service]
# The base image's environment.service copies `docker run -e` values into
# /etc/environment; read it after /etc/default so container settings win.
EnvironmentFile=-/etc/environment
# Write the startup link and logs to the container console, so they appear in
# `docker compose up` / `docker logs` when the container has a TTY.
Environment=OZWELL_DESKTOP_CONSOLE=/dev/console
SupplementaryGroups=tty
# compose mounts the host's ./dist here for development; wait (and say why) until it's built.
ExecStartPre=/bin/sh -c 'test -f /opt/ozwell-desktop/dist/cli.js || { echo "/opt/ozwell-desktop/dist/cli.js is missing; run make build on the host" >&2; sleep 4; exit 1; }'
