# Only checkpoint desktops opt in through org.criu.config. Do not install this as
# /etc/criu/runc.conf: unrelated containers must retain their own CRIU settings.
# Overlay file handles can require pathname lookup for desktop inotify watches.
irmap-scan-path /run
irmap-scan-path /tmp
irmap-scan-path /home
irmap-scan-path /root
irmap-scan-path /var
irmap-scan-path /usr/share
irmap-scan-path /usr/local/share
file-locks
tcp-established
