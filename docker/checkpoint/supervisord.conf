; Keep the complete desktop in one container cgroup for CRIU. No systemd or TTY.
[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
; Foreground supervisord already writes its own activity log to stdout.
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
childlogdir=/tmp

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:dbus]
command=/usr/local/bin/ozwell-checkpoint-component dbus
priority=10
user=desktop
directory=/home/desktop
environment=HOME="/home/desktop",USER="desktop",LOGNAME="desktop"
autorestart=true
startretries=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:xvfb]
command=/usr/local/bin/ozwell-checkpoint-component xvfb
priority=10
user=desktop
directory=/home/desktop
environment=HOME="/home/desktop",USER="desktop",LOGNAME="desktop"
autorestart=true
startretries=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:session]
command=/usr/local/bin/ozwell-checkpoint-component session
priority=20
user=desktop
directory=/home/desktop
environment=HOME="/home/desktop",USER="desktop",LOGNAME="desktop"
autorestart=true
startretries=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:server]
command=/usr/local/bin/ozwell-checkpoint-component server
priority=30
user=desktop
directory=/home/desktop
environment=HOME="/home/desktop",USER="desktop",LOGNAME="desktop"
autorestart=true
startretries=30
; Restarting the API must leave applications it launched running.
stopasgroup=false
killasgroup=false
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
