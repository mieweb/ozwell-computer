# Dev container and local deployment. Same image and systemd layout as production;
# the only difference is that your local ./dist (run `npm run build` first) is
# mounted over /opt/ozwell-computer/dist, so `npm run watch` changes are live.
name: ozwell-computer
services:
  ozwell-computer:
    build:
      context: .
      dockerfile: Dockerfile
    image: ozwell-computer:dev
    ports:
      - "${OZWELL_COMPUTER_HOST_PORT:-8080}:8080"
    environment:
      # Set in your shell or a .env file; if empty, a token is generated
      # and persisted; `docker compose up` prints a link with it embedded.
      OZWELL_COMPUTER_TOKEN: ${OZWELL_COMPUTER_TOKEN:-}
      OZWELL_COMPUTER_SCREEN: ${OZWELL_COMPUTER_SCREEN:-1920x1080x24}
      # The container can't see its host port; this makes the startup link clickable.
      OZWELL_COMPUTER_PUBLIC_URL: http://localhost:${OZWELL_COMPUTER_HOST_PORT:-8080}
      # Off by default: the read-only ./dist mount means an upgrade can't replace the
      # build, and a local build's version isn't comparable with releases. CI sets it
      # to cover the update endpoints.
      OZWELL_COMPUTER_UPDATE_URL: ${OZWELL_COMPUTER_UPDATE_URL:-off}
      # Fail (500) any reply that its OpenAPI response schema would change.
      OZWELL_COMPUTER_STRICT_RESPONSES: ${OZWELL_COMPUTER_STRICT_RESPONSES:-1}
    # A TTY gives systemd a console, so the startup link appears in `docker compose up`.
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Resource views for nested containers (e.g. Docker in a Proxmox LXC): LXCFS
      # virtualizes these files in the LXC, but Docker gives the container a fresh /proc
      # and /sys from the kernel, which show the whole physical host. Passing the outer
      # files through makes free/top/nproc and memory-sizing apps see the LXC's limits.
      # Without LXCFS they're simply the host's values, which the container sees anyway.
      - /proc/cpuinfo:/proc/cpuinfo:ro
      - /proc/diskstats:/proc/diskstats:ro
      - /proc/loadavg:/proc/loadavg:ro
      - /proc/meminfo:/proc/meminfo:ro
      - /proc/slabinfo:/proc/slabinfo:ro
      - /proc/stat:/proc/stat:ro
      - /proc/swaps:/proc/swaps:ro
      - /proc/uptime:/proc/uptime:ro
      - /sys/devices/system/cpu:/sys/devices/system/cpu:ro
      # The generated token persists here across `up`/`down` (removed by `down -v`).
      - state:/var/lib/ozwell-computer
      - type: bind
        source: ./dist
        target: /opt/ozwell-computer/dist
        read_only: true
        bind:
          # Fail clearly instead of creating an empty root-owned ./dist
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.status === 204 ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      start_period: 60s
      retries: 3
    # systemd as PID 1
    tmpfs:
      - /run
      - /run/lock
    cgroup: host
    stop_signal: SIGRTMIN+3
    shm_size: 1gb

volumes:
  state:
