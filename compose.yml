services:
  ozwell-desktop:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ozwell-desktop:dev
    ports:
      - "${OZWELL_DESKTOP_HOST_PORT:-8080}:8080"
    environment:
      # Set in your shell or a .env file; if empty, a token is generated
      # (docker compose exec ozwell-desktop cat /run/ozwell-desktop/token)
      OZWELL_DESKTOP_TOKEN: ${OZWELL_DESKTOP_TOKEN:-}
      OZWELL_DESKTOP_SCREEN: ${OZWELL_DESKTOP_SCREEN:-1920x1080x24}
    # systemd as PID 1
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroup: host
    stop_signal: SIGRTMIN+3
    shm_size: 1gb
