# Dev container and local deployment. Same image and systemd layout as production;
# the only difference is that your local ./dist (run `npm run build` first) is
# mounted over /opt/ozwell-desktop/dist, so `npm run watch` changes are live.
services:
  ozwell-desktop:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ozwell-desktop:dev
    ports:
      - "${OZWELL_DESKTOP_HOST_PORT:-8080}:8080"
    environment:
      # Set in your shell or a .env file; if empty, a token is generated
      # and persisted; `docker compose up` prints a link with it embedded.
      OZWELL_DESKTOP_TOKEN: ${OZWELL_DESKTOP_TOKEN:-}
      OZWELL_DESKTOP_SCREEN: ${OZWELL_DESKTOP_SCREEN:-1920x1080x24}
      # The container can't see its host port; this makes the startup link clickable.
      OZWELL_DESKTOP_PUBLIC_URL: http://localhost:${OZWELL_DESKTOP_HOST_PORT:-8080}
    # A TTY gives systemd a console, so the startup link appears in `docker compose up`.
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # The generated token persists here across `up`/`down` (removed by `down -v`).
      - state:/var/lib/ozwell-desktop
      - type: bind
        source: ./dist
        target: /opt/ozwell-desktop/dist
        read_only: true
        bind:
          # Fail clearly instead of creating an empty root-owned ./dist
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.status === 204 ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      start_period: 60s
      retries: 3
    # systemd as PID 1
    tmpfs:
      - /run
      - /run/lock
    cgroup: host
    stop_signal: SIGRTMIN+3
    shm_size: 1gb

volumes:
  state:
