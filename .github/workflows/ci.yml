name: CI

on:
  # Fast checks (typecheck, unit tests, build) on changes; docs-only changes skip CI.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  # The slow job (image, full integration suite, .deb, publish) runs only for these.
  # Publishing a GitHub release (tag vX.Y.Z) builds ozwell-computer_X.Y.Z_<arch>.deb
  # and the X.Y.Z image; the nightly run refreshes :latest.
  release:
    types: [published]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# A newer push supersedes a still-running build of the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - name: OpenAPI document and MCP tool catalog are up to date
        run: npm run openapi && npm run mcp-tools && git diff --exit-code docs/openapi.json docs/mcp-tools.json

  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    runs-on: ubuntu-latest
    needs: test
    if: contains(fromJSON('["release", "schedule", "workflow_dispatch"]'), github.event_name)
    permissions:
      contents: write  # release assets
      packages: write
    steps:
      # The image is large and gets built, run, exported (scan) and rebuilt for publishing;
      # drop SDKs this job doesn't use from the runner to make room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags, for ./package-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: docker/setup-buildx-action@v4
      - name: Build image for tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ozwell-computer:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the compose dev container
        run: docker compose up -d --wait --wait-timeout 120
        env:
          OZWELL_COMPUTER_TOKEN: testtoken
      - name: Install Playwright browsers
        run: npx playwright-core install --with-deps chromium firefox
      - name: Full regression suite (unit + integration, Chromium + Firefox)
        run: npm test
      - name: Logs on failure
        if: failure()
        run: docker compose exec -T ozwell-computer journalctl --no-pager -n 300
      - name: Stop the test container
        if: always()
        run: docker compose down -v
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ozwell-computer:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: Build the .deb
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: deb
          outputs: type=local,dest=pkg
          cache-from: type=gha
      # The release doubles as a flat APT repository (same scheme as
      # mieweb/opensource-server); the image ships docker/ozwell-computer.sources:
      #   deb [trusted=yes] https://github.com/mieweb/ozwell-computer/releases/latest/download/ ./
      - name: Generate flat APT repository metadata
        run: |
          command -v dpkg-scanpackages >/dev/null || { sudo apt-get update && sudo apt-get install -y dpkg-dev; }
          cd pkg
          dpkg-scanpackages --multiversion . > Packages
          gzip -k9f Packages
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: apt-repo
          path: |
            pkg/*.deb
            pkg/Packages
            pkg/Packages.gz
      - name: Attach the package and repository metadata to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" pkg/*.deb pkg/Packages pkg/Packages.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # amd64 only: the base image (ghcr.io/mieweb/opensource-server/nodejs) has no
      # arm64 variant. The package build is arch-native, so adding arm64 later is just
      # this platform list (plus docker/setup-qemu-action).
      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mieweb/ozwell-computer:${{ github.event_name == 'release' && github.event.release.tag_name || 'latest' }}
          cache-from: type=gha
