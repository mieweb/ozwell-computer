name: CI

on:
  # Fast checks (typecheck, unit tests, build) on changes; docs-only changes skip CI.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  # The slow job (image, full integration suite, .deb, publish) runs only for these.
  # Publishing a GitHub release (tag vX.Y.Z) builds ozwell-computer_X.Y.Z_<arch>.deb
  # and the X.Y.Z image; the nightly run refreshes :latest.
  release:
    types: [published]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# A newer push supersedes a still-running build of the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - name: OpenAPI document and MCP tool catalog are up to date
        run: npm run openapi && npm run mcp-tools && git diff --exit-code docs/openapi.json docs/mcp-tools.json

  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    env:
      OZWELL_COMPUTER_HOST_PORT: '18080'
    # Self-hosted (more reliable for the desktop/VNC/browser suite). Only trusted events
    # reach this job; see the README before allowing PRs from forks to run workflows.
    runs-on: [self-hosted, Linux, X64]
    needs: test
    if: contains(fromJSON('["release", "schedule", "workflow_dispatch"]'), github.event_name)
    permissions:
      contents: write  # release assets
      packages: write
    steps:
      # The image is large and gets built, run, exported (scan) and pushed;
      # drop SDKs this job doesn't use from the runner to make room.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags, for ./package-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Plain `docker build` on the runner's own engine: its layer cache persists between
      # runs, and the image lands straight in the engine (no gha cache upload/download,
      # no tarball export/load).
      - name: Build image for tests
        run: |
          docker build --target build -t ozwell-computer:build .   # the .deb, for the release
          docker build -t ozwell-computer:dev .                    # reuses that stage from cache
      - name: Start the compose dev container
        run: |
          docker compose down -v --remove-orphans || true   # leftovers from an earlier run
          docker compose up -d --wait --wait-timeout 180
        env:
          OZWELL_COMPUTER_TOKEN: testtoken
      - name: Install Playwright browsers
        run: npx playwright-core install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium firefox
      - name: Full regression suite (unit + integration, Chromium + Firefox)
        run: npm test
      - name: Logs on failure
        if: failure()
        run: docker compose exec -T ozwell-computer journalctl --no-pager -n 300
      - name: Stop the test container
        if: always()
        run: docker compose down -v
      - name: Scan image
        if: github.event_name != 'workflow_dispatch'  # report-only; releases and nightly
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ozwell-computer:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          cache: false  # trivy's own ~/.cache/trivy persists on the self-hosted runner
      - name: Copy out the .deb
        run: |
          rm -rf pkg && mkdir pkg
          # --entrypoint: the base image's ENTRYPOINT is /sbin/init, which would boot systemd
          # instead of running the command. Stream it out as a tar so no mount/chown is needed.
          docker run --rm --entrypoint sh ozwell-computer:build \
            -c 'cd /usr/src/ozwell-computer && tar -cf - *.deb' | tar -xf - -C pkg
          ls -l pkg
      # The release doubles as a flat APT repository (same scheme as
      # mieweb/opensource-server); the image ships docker/ozwell-computer.sources:
      #   deb [trusted=yes] https://github.com/mieweb/ozwell-computer/releases/latest/download/ ./
      - name: Generate flat APT repository metadata
        run: |
          command -v dpkg-scanpackages >/dev/null || { sudo apt-get update && sudo apt-get install -y dpkg-dev; }
          cd pkg
          dpkg-scanpackages --multiversion . > Packages
          gzip -k9f Packages
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: apt-repo
          path: |
            pkg/*.deb
            pkg/Packages
            pkg/Packages.gz
      - name: Attach the package and repository metadata to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" pkg/*.deb pkg/Packages pkg/Packages.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push the exact image the suite tested (no rebuild). amd64 only: the base image
      # (ghcr.io/mieweb/opensource-server/nodejs) has no arm64 variant.
      - name: Publish the tested image
        if: github.event_name != 'pull_request'
        run: |
          # Releases: the version tag and :latest. Nightly / manual runs: :main.
          for tag in ${{ github.event_name == 'release' && format('{0} latest', github.event.release.tag_name) || 'main' }}; do
            docker tag ozwell-computer:dev "ghcr.io/mieweb/ozwell-computer:$tag"
            docker push "ghcr.io/mieweb/ozwell-computer:$tag"
          done
