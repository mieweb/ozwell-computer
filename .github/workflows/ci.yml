name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - name: OpenAPI document is up to date
        run: npm run openapi && git diff --exit-code docs/openapi.json

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: docker/setup-buildx-action@v3
      - name: Build image for tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ozwell-desktop:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the compose dev container
        run: docker compose up -d --wait --wait-timeout 120
        env:
          OZWELL_DESKTOP_TOKEN: testtoken
      - name: Install Playwright browsers
        run: npx playwright-core install --with-deps chromium firefox
      - name: Full regression suite (unit + integration, Chromium + Firefox)
        run: npm test
      - name: Logs on failure
        if: failure()
        run: docker compose exec -T ozwell-desktop journalctl --no-pager -n 300
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ozwell-desktop:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'push'
      - name: Publish multi-arch image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mieweb/ozwell-desktop:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          cache-from: type=gha
