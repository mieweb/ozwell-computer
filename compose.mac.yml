# macOS / OrbStack: use with compose.yml (see README).
# Requires Docker Compose 2.24.4+ for !override.
services:
  ozwell-computer:
    # The base image currently supports amd64 only; OrbStack emulates it on Apple Silicon.
    platform: linux/amd64
    # Replace the list: normal merging would retain the Linux / LXCFS resource mounts
    # that failed to mount on OrbStack (for example /proc/slabinfo).
    volumes: !override
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - state:/var/lib/ozwell-computer
      - type: bind
        source: ./dist
        target: /opt/ozwell-computer/dist
        read_only: true
        bind:
          create_host_path: false
